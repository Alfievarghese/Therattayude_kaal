services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: therattayude_kaal_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - MODEL_PATH=/app/best.pt
    volumes:
      - centipede_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: therattayude_kaal_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  centipede_data:
    name: therattayude_kaal_data
